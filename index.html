<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>코레일+ 앱 실행 중...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      margin: 0;
      background: #f1f5f9;
      color: #1e293b;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
    }
    p {
      margin: 0 0 24px;
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 0;
      margin-bottom: 10px;
      background: #0054a6;
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(0,84,166,0.3);
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
      background: #003e7e;
    }
    .btn-alt {
      background: #3b82f6;
      box-shadow: 0 4px 12px rgba(59,130,246,0.25);
    }
    .btn-secondary {
      background: #f8fafc;
      color: #475569;
      border: 1px solid #cbd5e1;
      box-shadow: none;
      font-size: 14px;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚆</div>
    <h2>코레일+ 앱 열기</h2>
    <p>아래 버튼을 누르면 스마트폰에 설치된<br><strong>코레일+</strong> 앱이 즉시 실행됩니다.</p>
    
    <a id="btnKorail" class="btn" href="korail://">📱 코레일+ 앱 바로 열기</a>
    <a id="btnIntent" class="btn btn-alt" href="intent://#Intent;package=com.korail.talk;scheme=korail;end">📱 코레일+ 실행 (안드로이드)</a>
    <a id="btnGlory" class="btn btn-secondary" href="glorykorail://">호환 모드로 열기 (glorykorail)</a>
    <a class="btn btn-secondary" href="https://www.korail.com/ticket/search/general">🌐 코레일 모바일 웹으로 이동</a>
  </div>

  <script>
    // iOS / Android 감지 및 자동 앱 실행 시도
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    window.onload = function() {
      setTimeout(function() {
        if (isAndroid) {
          window.location.href = "intent://#Intent;package=com.korail.talk;scheme=korail;end";
        } else {
          window.location.href = "korail://";
        }
      }, 200);
    };
  </script>
</body>
</html>
