<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>코레일+ 앱 바로 실행</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 32px 24px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
    }
    .icon {
      font-size: 54px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #0284c7;
      color: #ffffff;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }
    p.desc {
      margin: 0 0 28px;
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .btn-main {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 18px 20px;
      margin-bottom: 14px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 16px;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 6px 20px rgba(37,99,235,0.4);
      cursor: pointer;
      border: none;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn-main:active {
      transform: scale(0.97);
      background: #1d4ed8;
    }
    .btn-green {
      background: #059669;
      box-shadow: 0 6px 20px rgba(5,150,105,0.35);
    }
    .btn-green:active {
      background: #047857;
    }
    .btn-sub {
      display: block;
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 10px;
      background: #334155;
      color: #cbd5e1;
      text-decoration: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #475569;
      cursor: pointer;
    }
    .btn-sub:active {
      background: #475569;
    }
    .notice {
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚆</div>
    <div class="badge">코레일·SRT 통합 승차권</div>
    <h2 id="titleText">코레일+ 앱 바로 열기</h2>
    <p class="desc" id="descText">
      아래 파란색 버튼을 누르면 스마트폰에 설치된<br>
      <strong>코레일+</strong> 앱이 스토어 없이 즉시 실행됩니다.
    </p>

    <!-- 1. 기본 원클릭 앱 실행 (korailtalk:// 및 안드로이드 인텐트 direct click) -->
    <a id="btnPrimary" class="btn-main" href="javascript:void(0);" onclick="openKorailApp();">
      📱 코레일+ 앱 즉시 열기
    </a>

    <!-- 2. 안드로이드 전용 인텐트 버튼 -->
    <a id="btnAndroid" class="btn-main btn-green" href="intent://#Intent;package=com.korail.talk;scheme=korailtalk;end;">
      🤖 안드로이드 전용 실행
    </a>

    <!-- 3. korailplus 스킴 -->
    <a id="btnPlus" class="btn-sub" href="korailplus://">
      🔄 korailplus:// 스킴으로 열기
    </a>

    <!-- 4. 모바일 웹 바로가기 -->
    <a id="btnWeb" class="btn-sub" href="https://www.korail.com/ticket/search/general">
      🌐 코레일 공식 모바일 웹
    </a>

    <div class="notice">
      💡 구글 플레이 화면으로 넘어가지 않고, 스마트폰 앱이 즉시 실행되도록 최적화되었습니다.
    </div>
  </div>

  <script>
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    function openKorailApp() {
      if (isAndroid) {
        // 안드로이드: intent 스킴을 직접 호출하여 앱 즉각 실행
        window.location.href = "intent://#Intent;package=com.korail.talk;scheme=korailtalk;end;";
      } else if (isIOS) {
        // iOS: korailplus:// 또는 korailtalk://
        window.location.href = "korailtalk://";
        setTimeout(function() {
          window.location.href = "korailplus://";
        }, 300);
      } else {
        window.location.href = "korailtalk://";
      }
    }
  </script>
</body>
</html>
