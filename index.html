<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>코레일+ 앱 즉시 실행</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 32px 24px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #0284c7;
      color: #ffffff;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }
    p.desc {
      margin: 0 0 28px;
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .btn-main {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 18px 20px;
      margin-bottom: 14px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 16px;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 6px 20px rgba(37,99,235,0.4);
      cursor: pointer;
      border: none;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn-main:active {
      transform: scale(0.97);
      background: #1d4ed8;
    }
    .notice {
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚆</div>
    <div class="badge">코레일+ 다이렉트 런처</div>
    <h2 id="titleText">코레일+ 앱 실행</h2>
    <p class="desc" id="descText">
      스마트폰에 설치된 <strong>코레일+</strong> 앱이 즉시 열립니다.<br>
      (스토어를 거치지 않고 앱으로 바로 직행합니다)
    </p>

    <!-- 안드로이드 런처 직접 실행 (구글 플레이 우회) -->
    <a id="btnPrimary" class="btn-main" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.korail.talk;end;">
      📱 코레일+ 앱 바로 열기
    </a>

    <div class="notice">
      💡 앱이 자동으로 실행되지 않는 경우 위 파란색 버튼을 터치해 주세요.
    </div>
  </div>

  <script>
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    function launchApp() {
      if (isAndroid) {
        // 안드로이드: 구글플레이로 빠지지 않는 순수 런처 인텐트
        window.location.href = "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.korail.talk;end;";
      } else if (isIOS) {
        window.location.href = "korailplus://";
        setTimeout(function() {
          window.location.href = "korailtalk://";
        }, 300);
      }
    }

    // 0.15초 후 자동 실행
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(launchApp, 150);
    });
  </script>
</body>
</html>
